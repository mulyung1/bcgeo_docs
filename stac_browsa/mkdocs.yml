INHERIT: ../shared/mkdocs.base.yml

site_name: STAC Browser
site_url: https://cgbenin.landscapealliance.org/stac_browsa/

theme:
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: yellow

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: teal
      accent: deep orange

plugins:
  - search
