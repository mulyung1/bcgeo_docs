# Shared base configuration for every topic site in this repo.
# Each topic's mkdocs.yml sets `INHERIT: ../shared/mkdocs.base.yml`
# and then defines its own site_name, site_url, plugins and palette deltas.
#
# NOTE (MkDocs INHERIT semantics): dicts are deep-merged, but lists
# (e.g. `plugins`) are REPLACED, not merged. Each topic declares its
# own full `plugins:` list.
theme:
  name: material
  # Relative to each topic's mkdocs.yml (one level down). The hub overrides it.
  custom_dir: ../shared/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Merriweather Sans
    code: Red Hat Mono
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: teal
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: teal
      accent: deep orange

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details

extra:
  # Show the "Back to Documentation Hub" bar (see shared/overrides/main.html).
  hub_link: true
