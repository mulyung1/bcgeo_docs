name: ci
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - name: Check secret is set.
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
        run: 'echo $PASSWORD | grep -q . || (echo "PASSWORD secret is not set" && exit 1)'

      - run: pip install -r requirements.txt

      # Builds the hub + every topic into ./site
      # (site/index.html, site/bcgeo/, site/stac_browsa/, ...)
      - name: Build all doc sites
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
        run: ./scripts/build.sh

      # Publishes the combined site directory to the gh-pages branch
      - name: Deploy combined site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
